name: Keep Supabase Alive & Cleanup Expired Files

on:
  schedule:
    # Runs every 5 days at 2 AM UTC
    - cron: '0 2 */5 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keep_alive_and_cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent pausing
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/documents?select=count&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo "Supabase pinged successfully"

      - name: Cleanup expired documents
        run: |
          curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/cleanup_expired_documents" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
          echo "Cleanup completed"
